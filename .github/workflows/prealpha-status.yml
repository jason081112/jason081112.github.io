name: Pre-Alpha status snapshot

# 每 15 分钟轮询一次：issue 变动与看板拖动都能在 15 分钟内同步到主页。
# 脚本检测到数据无变化时不写文件，因此不会产生空提交（公开仓库 Actions 免费）。
# 分钟写 7,22,37,52 而非 0,15,30,45：避开整点调度高峰，减少延迟。
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prealpha-status
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取 Pre_Alpha 指标
        env:
          PREALPHA_TOKEN: ${{ secrets.PREALPHA_TOKEN }}
        run: python3 scripts/fetch_prealpha_status.py

      - name: 数据有变化则提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pre-alpha.json
          if git diff --cached --quiet; then
            echo "数据无变化，无需提交"
          else
            git commit -m "chore: 更新 Pre_Alpha 状态快照"
            git push
          fi
